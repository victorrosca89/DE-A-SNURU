name: Build APK semnat
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Cheia de semnare: implicit cea din signing/de-a-snuru.jks. Poți s-o înlocuiești cu Secrets (vezi INSTRUCTIUNI.md).
      DN_KS: ${{ github.workspace }}/signing/de-a-snuru.jks
      DN_KS_PASS: ${{ secrets.DN_KS_PASS || 'eLe26ZE89sBKOuApUpYA' }}
      DN_KEY_ALIAS: ${{ secrets.DN_KEY_ALIAS || 'deasnuru' }}
      DN_KEY_PASS: ${{ secrets.DN_KEY_PASS || secrets.DN_KS_PASS || 'eLe26ZE89sBKOuApUpYA' }}
      DN_VC: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Cheia de semnare
        env:
          KS_B64: ${{ secrets.DN_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > signing/de-a-snuru.jks; fi
          test -f signing/de-a-snuru.jks || { echo "::error::Lipseste signing/de-a-snuru.jks - incarca folderul signing/ din GITHUB/ in repository."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: node scripts/prepare.js
        env:
          DN_SERVER_URL: ${{ vars.DN_SERVER_URL }}
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - run: npx cap sync android
      - name: Build release (semnat)
        run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease --no-daemon
      - name: Verifica semnatura
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK-ul nu a fost generat (verifica pasul Build release)"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p out && cp "$APK" out/DE-A-SNURU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DE-A-SNURU-apk
          path: out/DE-A-SNURU.apk
      - name: Publica in Releases (link direct de descarcare)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: DE-A ȘNURU' v2.${{ github.run_number }}
          files: out/DE-A-SNURU.apk
